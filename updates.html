<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ఆలయ నవీకరణలు – శ్రీ కాళేశ్వర ముక్తీశ్వర స్వామి దేవస్థానం</title>
<meta name="description" content="Kaleshwaram temple latest updates, announcements and notices for devotees.">
<link href="https://fonts.googleapis.com/css2?family=Mandali&display=swap" rel="stylesheet">
<style>
  :root{--sf:#e8761a;--mr:#7a1f1f;--ln:#f0dcc0;--mut:#7b6455}
  body{margin:0;background:#fffaf2;font-family:'Mandali',system-ui,sans-serif;color:#2b1a12;line-height:1.6}
  header{background:linear-gradient(135deg,#7a1f1f,#a3341f 60%,#e8761a);color:#fff;padding:22px 16px;text-align:center}
  header h1{margin:0;font-size:1.4rem;font-weight:400}
  header p{margin:4px 0 0;opacity:.85;font-size:.9rem;font-family:system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:16px}
  .back{display:inline-block;margin-bottom:12px;color:var(--mr);text-decoration:none}
  .card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:13px 15px;margin-bottom:12px}
  .tag{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:999px;background:var(--sf);color:#fff;margin-right:6px;font-family:system-ui,sans-serif}
  .tag.imp{background:var(--mr)}
  .new{font-size:.72rem;color:#d12b2b;font-weight:700;font-family:system-ui,sans-serif}
  .date{font-size:.8rem;color:var(--mut);font-family:system-ui,sans-serif;margin-left:4px}
  .card p{margin:6px 0 2px}
  .en{color:var(--mut);font-size:.85rem;font-family:system-ui,sans-serif}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters button{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:5px 14px;font:inherit;font-size:.9rem;cursor:pointer}
  .filters button.on{background:var(--mr);color:#fff;border-color:var(--mr)}
</style>
</head>
<body>
<header>
  <h1>ఆలయ నవీకరణలు</h1>
  <p>Sri Kaleshwara Mukteshwara Swamy Temple — Updates &amp; Notices</p>
</header>
<main>
  <a class="back" href="index.html">← హోమ్ పేజీకి</a>
  <div class="filters" id="filters"></div>
  <div id="list">లోడ్ అవుతోంది…</div>
</main>
<script>
(function(){
  var today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
  var data=[], cur="అన్నీ";
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function draw(){
    var items=data.filter(function(u){return cur==="అన్నీ"||u.tag===cur});
    document.getElementById("list").innerHTML=items.length?items.map(function(u){
      var isNew=(new Date(today)-new Date(u.date))<=3*864e5;
      return '<div class="card"><span class="tag'+(u.important?' imp':'')+'">'+esc(u.tag)+'</span>'+
        (isNew?'<span class="new">NEW</span>':'')+'<span class="date">'+esc(u.date)+'</span>'+
        '<p>'+esc(u.te)+'</p>'+(u.en?'<div class="en">'+esc(u.en)+'</div>':'')+'</div>';
    }).join(""):'<div class="card">ఈ విభాగంలో నవీకరణలు లేవు.</div>';
  }
  fetch("updates.json?v="+Date.now()).then(function(r){return r.json()}).then(function(all){
    data=all.filter(function(u){return !u.until||u.until>=today})
            .sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:0});
    var tags=["అన్నీ"].concat(data.map(function(u){return u.tag}).filter(function(t,i,a){return a.indexOf(t)===i}));
    var f=document.getElementById("filters");
    f.innerHTML=tags.map(function(t){return '<button data-t="'+esc(t)+'" class="'+(t===cur?'on':'')+'">'+esc(t)+'</button>'}).join("");
    f.onclick=function(e){var t=e.target.dataset&&e.target.dataset.t;if(!t)return;cur=t;
      [].forEach.call(f.children,function(b){b.className=b.dataset.t===cur?"on":""});draw()};
    draw();
  }).catch(function(){document.getElementById("list").textContent="నవీకరణలు లోడ్ కాలేదు. కొద్దిసేపటి తర్వాత ప్రయత్నించండి."});
})();
</script>
</body>
</html>
